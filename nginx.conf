    # Colour configurator — served by the bundled Next.js runtime.
    location ^~ /configurador {
        proxy_pass http://configurator_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_next/ {
        proxy_pass http://configurator_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /api/quotes {
        proxy_pass http://configurator_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /brand/ { proxy_pass http://configurator_next; proxy_set_header Host $host; }
    location ^~ /products/ { proxy_pass http://configurator_next; proxy_set_header Host $host; }
    location ^~ /previews/ { proxy_pass http://configurator_next; proxy_set_header Host $host; }
    location ^~ /references/ { proxy_pass http://configurator_next; proxy_set_header Host $host; }
    location ^~ /renders/ { proxy_pass http://configurator_next; proxy_set_header Host $host; }

    # Cache CSS/JS conservatively so clients can pick up recent deploys quickly.
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # Cache static media aggressively; these should be versioned when changed.
    location ~* \.(webp|jpg|jpeg|png|svg|gif|ico|woff2|woff|ttf|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static routes — serve index.html for each directory
    location / {
        # HTML must be revalidated after every deploy. This prevents branch,
        # fiscal and banking details from remaining stale in browser caches.
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Custom 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
