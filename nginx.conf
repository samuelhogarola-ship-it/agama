    location = /filiales/index.html    { return 301 /puntosdeventa/; }
    location = /filiales/index.en.html { return 301 /puntosdeventa/index.en.html; }
    location ~ ^/filiales/(chalco|cuautitlan|ecatepec|ermita|guadalajara|leon|merced|monterrey|pantitlan|puebla|queretaro|san-luis-potosi|texcoco|tlahuac|toluca|zaragoza)/index\.en\.html$ { return 301 /puntosdeventa/$1/index.en.html; }
