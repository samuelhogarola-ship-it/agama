<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>AGAMA Blog | English version not available</title>
  <meta name="description" content="The AGAMA blog is currently available in Spanish only. You will be redirected to the Spanish blog."/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex,follow"/>
  <link rel="canonical" href="https://www.agama.com.mx/blog/"/>
  <meta http-equiv="refresh" content="3; url=/blog/"/>
  <link href="../assets/css/normalize.css?v=20260617b" rel="stylesheet"/>
  <link href="../assets/css/webflow.css?v=20260617b" rel="stylesheet"/>
  <link href="../assets/css/webflow-base.css?v=20260617b" rel="stylesheet"/>
  <link href="../assets/img/logo-circulo.webp" rel="shortcut icon" type="image/webp"/>
  <link href="../assets/img/logo-circulo.webp" rel="apple-touch-icon"/>
  <style>
    :root {
      --agama-blue: #1745f5;
      --agama-blue-dark: #0f2f99;
      --agama-text: #475569;
      --agama-ink: #0f172a;
      --agama-surface: #ffffff;
      --agama-border: rgba(219, 228, 240, 0.9);
      --agama-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Geist", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--agama-ink);
      background:
        radial-gradient(circle at top left, rgba(23, 69, 245, 0.08), transparent 34%),
        linear-gradient(180deg, #ffffff 0%, #f7faff 55%, #ffffff 100%);
    }

    .redirect-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .redirect-modal {
      width: min(560px, 100%);
      background: var(--agama-surface);
      border: 1px solid var(--agama-border);
      border-radius: 28px;
      box-shadow: var(--agama-shadow);
      padding: 2rem;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      border: 1px solid rgba(23, 69, 245, 0.22);
      color: var(--agama-blue);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.75rem;
      font-weight: 700;
    }

    h1 {
      margin: 1rem 0 0.75rem;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: var(--agama-text);
      line-height: 1.7;
      font-size: 1rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.85rem;
      margin-top: 1.5rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      padding: 0.95rem 1.2rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .button:hover { transform: translateY(-1px); }

    .button-primary {
      background: var(--agama-blue);
      color: #fff;
    }

    .button-primary:hover { background: var(--agama-blue-dark); }

    .button-secondary {
      background: #fff;
      color: var(--agama-blue-dark);
      border: 1px solid rgba(23, 69, 245, 0.18);
    }

    .countdown {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: var(--agama-text);
    }
  </style>
</head>
<body>
  <main class="redirect-shell">
    <section class="redirect-modal" role="dialog" aria-modal="true" aria-labelledby="redirect-title">
      <div class="eyebrow">AGAMA Blog</div>
      <h1 id="redirect-title">English version not available</h1>
      <p>The AGAMA blog is currently published in Spanish only.</p>
      <p>You will be redirected to the Spanish blog automatically.</p>
      <div class="countdown" id="countdown">Redirecting in 3 seconds...</div>
      <div class="actions">
        <a class="button button-primary" href="/blog/">Go to the Spanish blog</a>
        <a class="button button-secondary" href="/index.en.html">Back to home</a>
      </div>
    </section>
  </main>
  <script>
    (function () {
      var remaining = 3;
      var countdown = document.getElementById('countdown');

      var timer = window.setInterval(function () {
        remaining -= 1;

        if (remaining <= 0) {
          window.clearInterval(timer);
          window.location.replace('/blog/');
          return;
        }

        if (countdown) {
          countdown.textContent = 'Redirecting in ' + remaining + ' second' + (remaining === 1 ? '' : 's') + '...';
        }
      }, 1000);
    })();
  </script>
</body>
</html>
