location = /entrada-de-blog/001-que-significa-la-palabra-agama {
  return 301 /blog/001-que-significa-la-palabra-agama/;
}

# Generic fallback for legacy blog post URLs whose slug matches the new WordPress slug.
location ~ ^/entrada-de-blog/([a-z0-9-]+)$ {
  return 301 /blog/$1/;
}
