# AGAMA blog redirects
# Apply when WordPress is already serving /blog

location = /blog-agama {
  return 301 /blog/;
}

location = /blog-agama/ {
  return 301 /blog/;
}

location = /entrada-de-blog/mb-115-negro-kalo-mejora-su-dispersion {
  return 301 /blog/mb-115-negro-kalo-mejora-su-dispersion/;
}

location = /entrada-de-blog/por-que-varia-el-color-en-materiales-lechosos-o-con-base-blanca {
  return 301 /blog/por-que-varia-el-color-en-materiales-lechosos-o-con-base-blanca/;
}

location = /entrada-de-blog/que-es-un-pigmento-y-que-es-un-masterbatch {
  return 301 /blog/que-es-un-pigmento-y-que-es-un-masterbatch/;
}

location = /entrada-de-blog/006-por-que-hay-colores-que-se-salen-del-plastico {
  return 301 /blog/006-por-que-hay-colores-que-se-salen-del-plastico/;
}

location = /entrada-de-blog/005-que-es-realmente-el-plastico {
  return 301 /blog/005-que-es-realmente-el-plastico/;
}

location = /entrada-de-blog/004-como-formulamos-los-masterbatch-de-linea {
  return 301 /blog/004-como-formulamos-los-masterbatch-de-linea/;
}

location = /entrada-de-blog/003-que-es-un-vehiculo {
  return 301 /blog/003-que-es-un-vehiculo/;
}

location = /entrada-de-blog/002-claves-de-productos {
