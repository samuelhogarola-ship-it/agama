<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría de Entrega — AGAMA</title>
  <style>
    /* ── CONFIG ── Override these vars to rebrand for another client */
    :root {
      --brand:       #c0c0c0;          /* silver */
      --brand-light: rgba(192,192,192,.1);
      --brand-dim:   #a0a0a0;
      --accent:      #e8e8e8;          /* near-white highlight */
      --danger:      #ff4d4d;
      --bg:          #080808;          /* near-black base */
      --surface:     #111111;          /* card surface */
      --surface2:    #181818;          /* hover / subsection bg */
      --border:      rgba(255,255,255,.08);
      --border-hi:   rgba(192,192,192,.25);
      --text:        #f0f0f0;
      --muted:       #7a7a7a;
      --radius:      10px;
      --shadow:      0 1px 0 rgba(255,255,255,.04), 0 4px 24px rgba(0,0,0,.5);
      --silver-grad: linear-gradient(135deg, #d4d4d4 0%, #8a8a8a 50%, #c8c8c8 100%);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── HEADER ── */
    header {
      background: #0e0e0e;
      border-bottom: 1px solid var(--border-hi);
      color: #fff;
      padding: 22px 32px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 0 rgba(192,192,192,.08), 0 4px 24px rgba(0,0,0,.6);
    }
    header .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.5px;
      background: var(--silver-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header .subtitle { opacity: .5; font-size: 12px; color: var(--brand); letter-spacing: .5px; text-transform: uppercase; }
    header .spacer { flex: 1; }

    /* Global progress pill */
    .global-pill {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      min-width: 160px;
    }
    .global-pill .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .global-pill .bar-wrap {
      width: 160px;
      height: 5px;
      background: rgba(255,255,255,.08);
      border-radius: 99px;
      overflow: hidden;
    }
    .global-pill .bar-fill {
      height: 100%;
      background: var(--silver-grad);
      border-radius: 99px;
      transition: width .4s ease;
    }
    .global-pill .pct { font-size: 12px; font-weight: 700; color: var(--brand); }

    /* ── LAYOUT ── */
    main {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 16px 64px;
    }

    /* ── META BAR ── */
    .meta-bar {
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .meta-bar label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 4px; }
    .meta-bar input {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      width: 180px;
    }
    .meta-bar input:focus { outline: 1px solid var(--brand); outline-offset: 1px; }
    .meta-actions { margin-left: auto; display: flex; align-items: flex-end; gap: 8px; }
    .btn {
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all .15s;
      letter-spacing: .3px;
    }
    .btn:hover { opacity: .8; transform: translateY(-1px); }
    .btn-primary {
      background: var(--silver-grad);
      color: #000;
      font-weight: 700;
    }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,.12); }
    .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,.25); }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid rgba(255,77,77,.3); }
    .btn-danger:hover { background: rgba(255,77,77,.1); opacity: 1; }

    /* ── STATS ROW ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow);
    }
    .stat-card .num {
      font-size: 28px;
      font-weight: 800;
      background: var(--silver-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-card .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-top: 2px; }
    .stat-card.danger .num { background: none; -webkit-text-fill-color: var(--danger); }
    .stat-card.warn .num { background: none; -webkit-text-fill-color: #a0a0a0; }

    /* ── SECTION ── */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: border-color .2s;
    }
    .section:hover { border-color: var(--border-hi); }
    .section.open { border-color: var(--border-hi); }
    .section-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 18px;
      cursor: pointer;
      user-select: none;
      transition: background .12s;
    }
    .section-head:hover { background: var(--surface2); }
    .section-icon { font-size: 16px; width: 26px; text-align: center; flex-shrink: 0; opacity: .85; }
    .section-title { font-weight: 600; font-size: 13px; flex: 1; letter-spacing: .2px; }
    .section-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(255,255,255,.06);
      color: var(--muted);
      border: 1px solid rgba(255,255,255,.08);
    }
    .section-badge.done {
      background: rgba(74,222,128,.12);
      color: #4ade80;
      border-color: rgba(74,222,128,.2);
    }
    .section-badge.none {
      background: rgba(255,77,77,.08);
      color: #f87171;
      border-color: rgba(255,77,77,.15);
    }

    /* Mini progress bar inside section header */
    .section-bar {
      width: 60px;
      height: 3px;
      background: rgba(255,255,255,.06);
      border-radius: 99px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .section-bar-fill {
      height: 100%;
      background: var(--silver-grad);
      border-radius: 99px;
      transition: width .3s;
    }

    .section-chevron {
      font-size: 10px;
      color: var(--muted);
      transition: transform .2s;
    }
    .section.open .section-chevron { transform: rotate(90deg); color: var(--brand); }

    .section-body {
      display: none;
      border-top: 1px solid var(--border);
    }
    .section.open .section-body { display: block; }

    /* Subsection inside body */
    .subsection { padding: 4px 0; }
    .subsection-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: rgba(192,192,192,.4);
      padding: 14px 18px 5px 52px;
      border-top: 1px solid var(--border);
    }
    .subsection-title:first-child { border-top: none; }

    /* ── ITEM ── */
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 18px;
      transition: background .1s;
      border-bottom: 1px solid rgba(255,255,255,.03);
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background: var(--surface2); }
    .item input[type=checkbox] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s, border-color .15s;
      position: relative;
      background: transparent;
    }
    .item input[type=checkbox]:checked {
      background: var(--silver-grad);
      border-color: transparent;
    }
    .item input[type=checkbox]:checked::after {
      content: '';
      position: absolute;
      left: 3px; top: 1px;
      width: 8px; height: 4px;
      border-left: 2px solid #000;
      border-bottom: 2px solid #000;
      transform: rotate(-45deg);
    }
    .item label {
      flex: 1;
      cursor: pointer;
      font-size: 13px;
      color: #d4d4d4;
    }
    .item.checked label { color: rgba(255,255,255,.25); text-decoration: line-through; }
    .item.failed { background: rgba(255,60,60,.04); }
    .item.failed label { color: #f87171; }
    .item.failed:hover { background: rgba(255,60,60,.08); }

    /* "No" toggle button */
    .item-no-btn {
      opacity: 0;
      background: none;
      border: 1px solid rgba(255,60,60,.3);
      color: #f87171;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity .15s, background .15s;
      letter-spacing: .3px;
    }
    .item:hover .item-no-btn { opacity: .6; }
    .item-no-btn:hover { opacity: 1 !important; background: rgba(255,60,60,.15); }
    .item.failed .item-no-btn { opacity: 1; background: rgba(255,60,60,.15); }

    /* Comment row */
    .item-comment-row {
      display: none;
      padding: 0 18px 8px 46px;
      gap: 8px;
      align-items: center;
    }
    .item-comment-row.visible { display: flex; }
    .item-comment-input {
      flex: 1;
      background: rgba(255,60,60,.06);
      border: 1px solid rgba(255,60,60,.2);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      color: #fca5a5;
      outline: none;
      font-family: inherit;
    }
    .item-comment-input:focus { border-color: rgba(255,100,100,.5); }
    .item-comment-input::placeholder { color: rgba(255,150,150,.3); }
    .item-comment-label {
      font-size: 10px;
      color: #f87171;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      flex-shrink: 0;
    }

    .item-note {
      font-size: 11px;
      color: var(--muted);
      width: 140px;
      text-align: right;
      font-style: italic;
    }

    /* Priority tag */
    .tag {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: .4px;
      flex-shrink: 0;
    }
    .tag-crit { background: rgba(255,77,77,.12); color: #f87171; border: 1px solid rgba(255,77,77,.2); }
    .tag-high  { background: rgba(192,192,192,.08); color: #a0a0a0; border: 1px solid rgba(192,192,192,.15); }

    /* ── DRAG & DROP ── */
    .drag-handle {
      cursor: grab;
      color: rgba(255,255,255,.18);
      font-size: 13px;
      padding: 0 2px 0 0;
      flex-shrink: 0;
      user-select: none;
      transition: color .15s;
      line-height: 1;
    }
    .section-head:hover .drag-handle { color: rgba(255,255,255,.45); }
    .drag-handle:active { cursor: grabbing; }
    .section.dragging {
      opacity: .35;
      border-color: rgba(192,192,192,.4) !important;
    }
    .section.drag-over {
      border-color: var(--brand) !important;
      box-shadow: 0 0 0 1px var(--brand-dim);
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,.2);
      padding: 40px 0 48px;
      letter-spacing: .3px;
    }
    footer strong { color: var(--muted); }

    /* ── ADD ITEM ROW ── */
    .add-item-row {
      display: flex;
      gap: 8px;
      padding: 10px 14px 12px 14px;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,.02);
    }
    .add-item-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      color: var(--text);
      outline: none;
    }
    .add-item-input:focus { border-color: var(--brand-dim); }
    .add-item-input::placeholder { color: rgba(255,255,255,.2); }
    .add-item-btn {
      background: rgba(192,192,192,.12);
      border: 1px solid rgba(192,192,192,.2);
      color: var(--brand);
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    .add-item-btn:hover { background: rgba(192,192,192,.2); }
    .item-delete {
      opacity: 0;
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      transition: opacity .15s;
      flex-shrink: 0;
    }
    .item:hover .item-delete { opacity: .5; }
    .item-delete:hover { opacity: 1 !important; }

    /* ── REPORT MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 200;
      overflow-y: auto;
      padding: 32px 16px;
    }
    .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal {
      background: #111;
      border: 1px solid rgba(192,192,192,.2);
      border-radius: 14px;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 24px 80px rgba(0,0,0,.8);
      overflow: hidden;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: #0e0e0e;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 800;
      background: var(--silver-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 0; }

    /* ── Hero progress bar ── */
    .rep-hero {
      padding: 20px 24px 18px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      background: #0a0a0a;
    }
    .rep-meta-line {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .rep-meta-line strong { color: #e0e0e0; }
    .rep-progress-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .rep-pct-big {
      font-size: 36px;
      font-weight: 900;
      background: var(--silver-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      flex-shrink: 0;
    }
    .rep-bar-col { flex: 1; }
    .rep-bar-wrap {
      height: 6px;
      background: rgba(255,255,255,.07);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .rep-bar-fill {
      height: 100%;
      background: var(--silver-grad);
      border-radius: 99px;
      transition: width .6s ease;
    }
    .rep-bar-labels {
      display: flex;
      gap: 14px;
      font-size: 11px;
    }
    .rep-lbl { display: flex; align-items: center; gap: 4px; }
    .rep-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .rep-dot.ok   { background: #4ade80; }
    .rep-dot.ko   { background: #f87171; }
    .rep-dot.pend { background: #333; border: 1px solid #444; }

    /* ── Scrollable section list ── */
    .rep-list {
      padding: 16px 24px 20px;
      max-height: 52vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.1) transparent;
    }

    /* ── Section cards ── */
    .rep-card {
      border-left: 3px solid rgba(255,255,255,.08);
      border-radius: 0 8px 8px 0;
      padding: 12px 14px;
      margin-bottom: 6px;
      background: rgba(255,255,255,.02);
      transition: background .15s;
    }
    .rep-card.ok   { border-left-color: #4ade80; background: rgba(74,222,128,.04); }
    .rep-card.ko   { border-left-color: #f87171; background: rgba(248,113,113,.05); }
    .rep-card.part { border-left-color: #c0c0c0; background: rgba(192,192,192,.03); }
    .rep-card.pend { border-left-color: #222; opacity: .55; }

    .rep-card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .rep-icon { font-size: 14px; flex-shrink: 0; line-height: 1; }
    .rep-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .7px;
      flex: 1;
    }
    .rep-card.ok   .rep-title { color: #86efac; }
    .rep-card.ko   .rep-title { color: #fca5a5; }
    .rep-card.part .rep-title { color: #c0c0c0; }
    .rep-card.pend .rep-title { color: #444; }

    /* Mini bar per section */
    .rep-mini-bar {
      width: 48px;
      height: 3px;
      background: rgba(255,255,255,.06);
      border-radius: 99px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .rep-mini-fill {
      height: 100%;
      border-radius: 99px;
    }
    .rep-card.ok   .rep-mini-fill { background: #4ade80; }
    .rep-card.ko   .rep-mini-fill { background: #f87171; }
    .rep-card.part .rep-mini-fill { background: var(--silver-grad); }
    .rep-card.pend .rep-mini-fill { background: #333; }

    .rep-badge {
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
      min-width: 30px;
      text-align: right;
    }
    .rep-text {
      font-size: 12px;
      line-height: 1.6;
    }
    .rep-card.ok   .rep-text { color: #bbf7d0; }
    .rep-card.ko   .rep-text { color: #fee2e2; }
    .rep-card.part .rep-text { color: #a0a0a0; }
    .rep-card.pend .rep-text { color: #404040; }

    /* KO issues */
    .rep-issues { margin-top: 8px; padding-top: 7px; border-top: 1px solid rgba(248,113,113,.15); }
    .rep-issue { font-size: 11px; color: #f87171; padding: 2px 0; display: flex; gap: 6px; align-items: baseline; }
    .rep-issue-sym { flex-shrink: 0; font-size: 9px; }

    /* Pending sub-list */
    .rep-pend-list { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.04); }
    .rep-pend-item { font-size: 11px; color: #3a3a3a; padding: 2px 0; display: flex; gap: 6px; }
    .modal-actions {
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      border-top: 1px solid rgba(255,255,255,.06);
      background: #0e0e0e;
    }

    /* ── PRINT ── */
    @media print {
      body { background: #fff; color: #000; }
      header { position: static; background: #000; }
      .section { background: #fff; border-color: #ccc; }
      .section-body { display: block !important; }
      .modal-overlay { display: none !important; }
      .btn, .meta-actions { display: none; }
    }

    @media (max-width: 600px) {
      header { padding: 16px; flex-wrap: wrap; }
      .global-pill { min-width: 120px; }
      .global-pill .bar-wrap { width: 120px; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo" id="h-client">AGAMA</div>
    <div class="subtitle" id="h-subtitle">Auditoría de Entrega Web</div>
  </div>
  <div class="spacer"></div>
  <div class="global-pill">
    <span class="label">Progreso global</span>
    <div class="bar-wrap"><div class="bar-fill" id="global-bar" style="width:0%"></div></div>
    <span class="pct" id="global-pct">0 / 0 — 0%</span>
  </div>
</header>

<main>

  <!-- Meta bar -->
  <div class="meta-bar">
    <div>
      <label>Cliente</label>
      <input id="meta-client" type="text" placeholder="Nombre del cliente" value="AGAMA">
    </div>
    <div>
      <label>Proyecto</label>
      <input id="meta-project" type="text" placeholder="Ej: Rediseño web" value="Migración Web 2025">
    </div>
    <div>
      <label>Responsable</label>
      <input id="meta-owner" type="text" placeholder="Tu nombre">
    </div>
    <div>
      <label>Fecha entrega</label>
      <input id="meta-date" type="date">
    </div>
    <div class="meta-actions">
      <button class="btn btn-ghost" onclick="expandAll()">Expandir todo</button>
      <button class="btn btn-ghost" onclick="collapseAll()">Colapsar</button>
      <button class="btn btn-danger" onclick="resetAll()">Reset</button>
      <button class="btn btn-ghost" onclick="openReport()">Vista previa</button>

/* ══════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════ */
const KEY       = 'delivery-checklist-v2';
const DYN_KEY   = 'delivery-checklist-dynamic';
const FAIL_KEY  = 'delivery-checklist-failed';
const NOTES_KEY = 'delivery-checklist-notes';
const ORDER_KEY = 'delivery-checklist-order';

function getSectionOrder() {
  const saved = JSON.parse(localStorage.getItem(ORDER_KEY) || 'null');
  if (!saved) return SECTIONS.map(s => s.id);
  // merge: keep saved order, append any new sections not in saved
  const known = new Set(saved);
  return [...saved.filter(id => SECTIONS.find(s => s.id === id)),
          ...SECTIONS.filter(s => !known.has(s.id)).map(s => s.id)];
}

function saveSectionOrder(ids) {
  localStorage.setItem(ORDER_KEY, JSON.stringify(ids));
}

function getFailedSet()  { return new Set(JSON.parse(localStorage.getItem(FAIL_KEY)  || '[]')); }
function getNotes()      { return JSON.parse(localStorage.getItem(NOTES_KEY) || '{}'); }

function toggleFailed(id, isFailed) {
  const set = getFailedSet();
  isFailed ? set.add(id) : set.delete(id);
  localStorage.setItem(FAIL_KEY, JSON.stringify([...set]));
}

function saveNote(id, text) {
  const notes = getNotes();
  if (text) notes[id] = text; else delete notes[id];
  localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
}

function getDynItems(secId) {
  const all = JSON.parse(localStorage.getItem(DYN_KEY) || '{}');
  return all[secId] || [];
}

function saveDynItem(secId, label) {
  const all = JSON.parse(localStorage.getItem(DYN_KEY) || '{}');
  if (!all[secId]) all[secId] = [];
  const id = 'dyn-' + secId + '-' + Date.now();
  all[secId].push({ id, label });
  localStorage.setItem(DYN_KEY, JSON.stringify(all));
  return id;
}

function deleteDynItem(secId, itemId) {
  const all = JSON.parse(localStorage.getItem(DYN_KEY) || '{}');
  if (!all[secId]) return;
  all[secId] = all[secId].filter(i => i.id !== itemId);
  localStorage.setItem(DYN_KEY, JSON.stringify(all));
  // also remove its checked state
  const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
  delete saved[itemId];
  localStorage.setItem(KEY, JSON.stringify(saved));
}

function getAllItems(section) {
  const base = section.items
    ? section.items
    : section.subsections.flatMap(s => s.items);
  const dyn = getDynItems(section.id);
  return [...base, ...dyn];
}

function renderChecklist() {
  const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
  const container = document.getElementById('checklist');
  container.innerHTML = '';

  const order = getSectionOrder();
  const sortedSections = order.map(id => SECTIONS.find(s => s.id === id)).filter(Boolean);

  sortedSections.forEach(sec => {
    const allItems = getAllItems(sec);
    const el = document.createElement('div');
    el.className = 'section';
    el.dataset.id = sec.id;

    // Head
    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `
      <span class="drag-handle" title="Arrastrar para reordenar">⠿</span>
      <span class="section-icon">${sec.icon}</span>
      <span class="section-title">${sec.title}</span>
      <div class="section-bar"><div class="section-bar-fill" id="bar-${sec.id}" style="width:0%"></div></div>
      <span class="section-badge" id="badge-${sec.id}">0/${allItems.length}</span>
      <span class="section-chevron">▶</span>
    `;
    // Toggle open only when clicking non-handle parts
    head.addEventListener('click', e => {
      if (!e.target.classList.contains('drag-handle')) el.classList.toggle('open');
    });
    el.appendChild(head);

    // Body
    const body = document.createElement('div');
    body.className = 'section-body';
    body.id = 'body-' + sec.id;

    if (sec.items) {
      sec.items.forEach(item => body.appendChild(renderItem(item, saved, sec.id)));
    } else {
      sec.subsections.forEach(sub => {
        const stitle = document.createElement('div');
        stitle.className = 'subsection-title';
        stitle.textContent = sub.title;
        body.appendChild(stitle);
        sub.items.forEach(item => body.appendChild(renderItem(item, saved, sec.id)));
      });
    }

    // Dynamic (user-added) items
    getDynItems(sec.id).forEach(item => {
      body.appendChild(renderItem(item, saved, sec.id, true));
    });

    // Add-item row (always shown, all sections)
    body.appendChild(renderAddRow(sec.id, body, saved));

    el.appendChild(body);

    // ── Drag & Drop ──
    el.draggable = true;

    el.addEventListener('dragstart', e => {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', sec.id);
      setTimeout(() => el.classList.add('dragging'), 0);
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      container.querySelectorAll('.section').forEach(s => s.classList.remove('drag-over'));
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      container.querySelectorAll('.section').forEach(s => s.classList.remove('drag-over'));
      if (!el.classList.contains('dragging')) el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', e => {
      // only remove if leaving the section entirely
      if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over');
    });
    el.addEventListener('drop', e => {
      e.preventDefault();
      const fromId = e.dataTransfer.getData('text/plain');
      const toId   = sec.id;
      if (fromId === toId) return;

      const els    = [...container.querySelectorAll('.section')];
      const fromEl = els.find(s => s.dataset.id === fromId);
      const toEl   = els.find(s => s.dataset.id === toId);
      if (!fromEl || !toEl) return;

      const fromIdx = els.indexOf(fromEl);
      const toIdx   = els.indexOf(toEl);
      if (fromIdx < toIdx) toEl.after(fromEl);
      else toEl.before(fromEl);

      toEl.classList.remove('drag-over');

      // persist new order
      const newOrder = [...container.querySelectorAll('.section')].map(s => s.dataset.id);
      saveSectionOrder(newOrder);
    });

    container.appendChild(el);
  });

  updateStats();
}

function renderAddRow(secId, body, saved) {
  const row = document.createElement('div');
  row.className = 'add-item-row';

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'add-item-input';
  input.placeholder = 'Añadir mejora o tarea…';

  const btn = document.createElement('button');
  btn.className = 'add-item-btn';
  btn.textContent = '+ Añadir';

  const doAdd = () => {
    const label = input.value.trim();
    if (!label) return;
    const id = saveDynItem(secId, label);
    const newItem = { id, label };
    const itemEl = renderItem(newItem, {}, secId, true);
    body.insertBefore(itemEl, row);
    input.value = '';
    updateStats();
  };

  btn.addEventListener('click', doAdd);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });

  row.appendChild(input);
  row.appendChild(btn);
  return row;
}

function renderItem(item, saved, secId, isDynamic = false) {
  const failed = getFailedSet().has(item.id);
  const notes  = getNotes();

  // Wrapper (item row + comment row)
  const wrapper = document.createElement('div');
  wrapper.dataset.itemWrapper = item.id;

  // ── Item row ──
  const div = document.createElement('div');
  div.className = 'item' + (saved[item.id] ? ' checked' : '') + (failed ? ' failed' : '');
  div.dataset.id = item.id;

  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.id = 'chk-' + item.id;
  checkbox.checked = !!saved[item.id];
  checkbox.addEventListener('change', () => {
    const data = JSON.parse(localStorage.getItem(KEY) || '{}');
    data[item.id] = checkbox.checked;
    localStorage.setItem(KEY, JSON.stringify(data));
    div.classList.toggle('checked', checkbox.checked);
    // uncheck "failed" if now checked
    if (checkbox.checked && div.classList.contains('failed')) {
      div.classList.remove('failed');
      toggleFailed(item.id, false);
      commentRow.classList.remove('visible');
    }
    updateStats();
  });

  const label = document.createElement('label');
  label.htmlFor = 'chk-' + item.id;
  label.textContent = item.label;

  // ── No button ──
  const noBtn = document.createElement('button');
  noBtn.className = 'item-no-btn';
  noBtn.textContent = failed ? 'NO ✕' : 'NO';
  noBtn.title = 'Marcar como no completado / bloqueado';

  // ── Comment row ──
  const commentRow = document.createElement('div');
  commentRow.className = 'item-comment-row' + (failed ? ' visible' : '');

  const commentLabel = document.createElement('span');
  commentLabel.className = 'item-comment-label';
  commentLabel.textContent = '⚠';

  const commentInput = document.createElement('input');
  commentInput.type = 'text';
  commentInput.className = 'item-comment-input';
  commentInput.placeholder = 'Resultado, bloqueo o mejora del 15%…';
  commentInput.value = notes[item.id] || '';
  commentInput.addEventListener('input', () => saveNote(item.id, commentInput.value));

  commentRow.appendChild(commentLabel);
  commentRow.appendChild(commentInput);

  noBtn.addEventListener('click', e => {
    e.stopPropagation();
    const nowFailed = !div.classList.contains('failed');
    div.classList.toggle('failed', nowFailed);
    toggleFailed(item.id, nowFailed);
    noBtn.textContent = nowFailed ? 'NO ✕' : 'NO';
    commentRow.classList.toggle('visible', nowFailed);
    if (nowFailed) {
      // uncheck if was checked
      checkbox.checked = false;
      const data = JSON.parse(localStorage.getItem(KEY) || '{}');
      delete data[item.id];
      localStorage.setItem(KEY, JSON.stringify(data));
      div.classList.remove('checked');
      setTimeout(() => commentInput.focus(), 50);
    }
    updateStats();
  });

  div.appendChild(checkbox);
  div.appendChild(label);

  if (item.crit) {
    const tag = document.createElement('span');
    tag.className = 'tag tag-crit';
    tag.textContent = 'Crítico';
    div.appendChild(tag);
  } else if (item.high) {
    const tag = document.createElement('span');
    tag.className = 'tag tag-high';
    tag.textContent = 'Alto';
    div.appendChild(tag);
  }

  div.appendChild(noBtn);

  if (isDynamic) {
    const del = document.createElement('button');
    del.className = 'item-delete';
    del.title = 'Eliminar';
    del.textContent = '✕';
    del.addEventListener('click', e => {
      e.stopPropagation();
      deleteDynItem(secId, item.id);
      wrapper.remove();
      updateStats();
    });
    div.appendChild(del);
  }

  wrapper.appendChild(div);
  wrapper.appendChild(commentRow);
  return wrapper;
}

function updateStats() {
  const failedSet = getFailedSet();
  const allItems  = SECTIONS.flatMap(s => getAllItems(s));
  const total     = allItems.length;
  const done      = allItems.filter(i => document.getElementById('chk-' + i.id)?.checked).length;
  const failed    = allItems.filter(i => failedSet.has(i.id)).length;
  const pct       = total ? Math.round(done / total * 100) : 0;

  document.getElementById('stat-total').textContent   = total;
  document.getElementById('stat-done').textContent    = done;
  document.getElementById('stat-failed').textContent  = failed;
  document.getElementById('stat-pending').textContent = total - done - failed;
  document.getElementById('stat-sections').textContent = SECTIONS.length;

  document.getElementById('global-bar').style.width  = pct + '%';
  document.getElementById('global-pct').textContent  = `${done} / ${total} — ${pct}%`;

  SECTIONS.forEach(sec => {
    const items   = getAllItems(sec);
    const secDone = items.filter(i => document.getElementById('chk-' + i.id)?.checked).length;
    const secPct  = items.length ? Math.round(secDone / items.length * 100) : 0;
    const badge   = document.getElementById('badge-' + sec.id);
    const bar     = document.getElementById('bar-' + sec.id);
    if (badge) {
      badge.textContent = `${secDone}/${items.length}`;
      badge.className = 'section-badge' + (secDone === items.length ? ' done' : secDone === 0 ? ' none' : '');
    }
    if (bar) bar.style.width = secPct + '%';
  });
}

function openReport() {
  const failedSet = getFailedSet();
  const notes     = getNotes();
  const client    = document.getElementById('meta-client').value  || '—';
  const project   = document.getElementById('meta-project').value || '—';
  const owner     = document.getElementById('meta-owner').value   || '—';
  const date      = document.getElementById('meta-date').value    || new Date().toISOString().slice(0,10);

  const allItems   = SECTIONS.flatMap(s => getAllItems(s));
  const total      = allItems.length;
  const totalDone  = allItems.filter(i => document.getElementById('chk-' + i.id)?.checked).length;
  const totalFail  = allItems.filter(i => failedSet.has(i.id)).length;
  const totalPend  = total - totalDone - totalFail;
  const pct        = total ? Math.round(totalDone / total * 100) : 0;

  const okPct  = total ? Math.round(totalDone / total * 100) : 0;
  const koPct  = total ? Math.round(totalFail / total * 100) : 0;

  let html = `
    <div class="rep-hero">
      <div class="rep-meta-line">
        <span><strong>${client}</strong> · ${project}</span>
        <span>Responsable: <strong>${owner}</strong></span>
        <span>${date}</span>
      </div>
      <div class="rep-progress-row">
        <div class="rep-pct-big">${pct}%</div>
        <div class="rep-bar-col">
          <div class="rep-bar-wrap">
            <div class="rep-bar-fill" style="width:${pct}%"></div>
          </div>
          <div class="rep-bar-labels">
            <span class="rep-lbl"><span class="rep-dot ok"></span><span style="color:#4ade80;font-weight:700">${totalDone} OK</span></span>
            <span class="rep-lbl"><span class="rep-dot ko"></span><span style="color:#f87171;font-weight:700">${totalFail} KO</span></span>
            <span class="rep-lbl"><span class="rep-dot pend"></span><span style="color:#555">${totalPend} pendiente</span></span>
          </div>
        </div>
      </div>
    </div>
    <div class="rep-list">`;

  // One card per section
  const order = getSectionOrder();
  const sorted = order.map(id => SECTIONS.find(s => s.id === id)).filter(Boolean);

  sorted.forEach(sec => {
    const items   = getAllItems(sec);
    const done    = items.filter(i => document.getElementById('chk-' + i.id)?.checked).length;
    const failed  = items.filter(i => failedSet.has(i.id));
    const pend    = items.filter(i => !document.getElementById('chk-' + i.id)?.checked && !failedSet.has(i.id));
    const sumDefs = SUMMARIES[sec.id] || { ok: '✓', part: '~', ko: '✕', pend: '—' };
    const secPct  = items.length ? Math.round(done / items.length * 100) : 0;

    let cssClass, summaryText;
    if (failed.length > 0) {
      cssClass = 'ko';
      summaryText = failed.length === items.length ? sumDefs.ko : sumDefs.part;
    } else if (done === items.length) {
      cssClass = 'ok'; summaryText = sumDefs.ok;
    } else if (done === 0) {
      cssClass = 'pend'; summaryText = sumDefs.pend;
    } else {
      cssClass = 'part'; summaryText = sumDefs.part;
    }

    let issuesHtml = '';
    if (failed.length) {
      issuesHtml = `<div class="rep-issues">`;
      failed.forEach(i => {
        const note = notes[i.id] || i.label;
        issuesHtml += `<div class="rep-issue"><span class="rep-issue-sym">✕</span><span>${note}</span></div>`;
      });
      issuesHtml += `</div>`;
    }

    let pendHtml = '';
    if (cssClass === 'part' && pend.length) {
      pendHtml = `<div class="rep-pend-list">`;
      pend.slice(0, 4).forEach(i => {
        pendHtml += `<div class="rep-pend-item"><span>·</span><span>${i.label}</span></div>`;
      });
      if (pend.length > 4) pendHtml += `<div class="rep-pend-item"><span></span><span>+${pend.length - 4} más pendientes</span></div>`;
      pendHtml += `</div>`;
    }

    html += `
      <div class="rep-card ${cssClass}">
        <div class="rep-card-head">
          <span class="rep-icon">${sec.icon}</span>
          <span class="rep-title">${sec.title}</span>
          <div class="rep-mini-bar"><div class="rep-mini-fill" style="width:${secPct}%"></div></div>
          <span class="rep-badge">${done}/${items.length}</span>
        </div>
        <div class="rep-text">${summaryText}</div>
        ${issuesHtml}${pendHtml}
      </div>`;
  });

  html += `</div>`;

  document.getElementById('report-body').innerHTML = html;
  document.getElementById('report-modal').classList.add('open');
}
