<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8"/>
  <title>Página no encontrada — AGAMA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex"/>
  <link href="/assets/css/normalize.css" rel="stylesheet"/>
  <link href="/assets/css/webflow.css" rel="stylesheet"/>
  <link href="/assets/css/webflow-base.css" rel="stylesheet"/>
  <link href="/assets/img/logo-circulo.webp" rel="shortcut icon" type="image/webp"/>
  <style>
    body { margin: 0; font-family: 'Inter', sans-serif; background: #f7f8fa; }
    .error-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .error-code {
      font-size: 7rem;
      font-weight: 800;
      color: #002f6c;
      line-height: 1;
      margin: 0 0 1rem;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #002f6c;
      margin: 0 0 .75rem;
    }
    .error-sub {
      font-size: 1rem;
      color: #666;
      max-width: 40ch;
      line-height: 1.6;
      margin: 0 0 2rem;
    }
    .error-btn {
      display: inline-block;
      background: #0055b3;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      padding: .85rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      transition: background .2s;
    }
    .error-btn:hover { background: #002f6c; }
    .error-logo { margin-bottom: 2.5rem; }
    .error-logo img { height: 32px; }
  </style>
</head>
<body>
  <div class="error-wrap">
    <div class="error-logo">
      <a href="/"><img src="/assets/img/agama.svg" alt="AGAMA"/></a>
    </div>
    <div class="error-code">404</div>
    <h1 class="error-title">Página no encontrada</h1>
    <p class="error-sub">La página que buscas no existe o fue movida. Regresa al inicio para continuar.</p>
    <a href="/" class="error-btn">Ir al inicio</a>
  </div>
</body>
</html>
